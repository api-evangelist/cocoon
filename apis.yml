aid: cocoon
name: Cocoon
description: >-
  Cocoon is next-generation employee leave management software that automates the
  complexities of compliance, claims, and payroll for every type of employee leave
  (parental, medical, caregiver, accommodation, bereavement, and personal) across
  all 50 U.S. states. It factors in state, federal, company, and insurance benefits
  to calculate eligibility, generate designation notices, and streamline the leave
  experience for both employees and HR teams. Cocoon connects to 20+ HRIS and payroll
  platforms (Workday, Rippling, Gusto, BambooHR, ADP, Paylocity, UKG, and more) via
  API integrations that sync employee data in real time. Founded in 2020 by former
  Stripe and Square leaders and backed by Index Ventures and First Round Capital,
  Cocoon was acquired by TriNet in April 2026. Cocoon is a consumer of HRIS/payroll
  APIs rather than a publisher of a public developer API; no public OpenAPI, SDKs,
  or developer portal are published.
